<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c5c4c" />
      <stop offset="100%" stop-color="#083e33" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Inner white container -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="#ffffff" filter="url(#shadow)" />

  <!-- QR Finder Patterns: Top-Left -->
  <rect x="116" y="116" width="90" height="90" rx="14" fill="#0c5c4c" />
  <rect x="134" y="134" width="54" height="54" rx="8" fill="#ffffff" />
  <rect x="146" y="146" width="30" height="30" rx="4" fill="#0c5c4c" />

  <!-- QR Finder Patterns: Top-Right -->
  <rect x="306" y="116" width="90" height="90" rx="14" fill="#0c5c4c" />
  <rect x="324" y="134" width="54" height="54" rx="8" fill="#ffffff" />
  <rect x="336" y="146" width="30" height="30" rx="4" fill="#0c5c4c" />

  <!-- QR Finder Patterns: Bottom-Left -->
  <rect x="116" y="306" width="90" height="90" rx="14" fill="#0c5c4c" />
  <rect x="134" y="324" width="54" height="54" rx="8" fill="#ffffff" />
  <rect x="146" y="336" width="30" height="30" rx="4" fill="#0c5c4c" />

  <!-- QR Data Bits -->
  <rect x="236" y="126" width="40" height="40" rx="6" fill="#0c5c4c" />
  <rect x="236" y="186" width="40" height="40" rx="6" fill="#0c5c4c" />
  <rect x="186" y="236" width="40" height="40" rx="6" fill="#0c5c4c" />
  <rect x="236" y="236" width="40" height="40" rx="6" fill="#0c5c4c" />
  <rect x="286" y="236" width="40" height="40" rx="6" fill="#0c5c4c" />
  <rect x="336" y="236" width="30" height="30" rx="4" fill="#0c5c4c" />
  <rect x="236" y="306" width="40" height="40" rx="6" fill="#0c5c4c" />
  <rect x="236" y="366" width="40" height="40" rx="6" fill="#0c5c4c" />
  <rect x="306" y="306" width="40" height="40" rx="6" fill="#0c5c4c" />
  <rect x="356" y="356" width="40" height="40" rx="6" fill="#0c5c4c" />
  <rect x="306" y="366" width="30" height="30" rx="4" fill="#0c5c4c" />

  <!-- Golden Receipt / Tax Badge in center -->
  <circle cx="256" cy="256" r="38" fill="#a9792c" />
  <path d="M246 244 L256 234 L266 244 M256 238 L256 274" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
